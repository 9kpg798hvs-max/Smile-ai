[project]
name = "postop-triage"
version = "0.1.0"
description = "Post-op check-in triage classifier and eval harness (see SPEC.md)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.116.0",
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["triage*", "evals*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
